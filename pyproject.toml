[project]
name = "homescout"
version = "0.1.0"
description = "Find single-family homes likely to come to market from free public records"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
  "pyarrow>=15",
  "requests>=2.31",
]

[project.optional-dependencies]
enrich = [
  "geopandas>=0.14",
  "openpyxl>=3.1",
  "osmium>=3.7",
  "pvlib>=0.11",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "scipy>=1.11",
  "shapely>=2",
]
dev = [
  "pytest>=8",
]

[project.scripts]
homescout-migrate = "db.migrate:main"
homescout-load = "db.load_csv:main"
homescout-export = "db.export:main"
homescout-build = "app.build_mobile:main"
homescout-build-desktop = "app.build_app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "app*", "db*"]

[tool.setuptools.package-data]
app = ["*.html"]
db = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
